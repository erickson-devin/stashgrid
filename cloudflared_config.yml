# ~/.cloudflared/config.yml
#
# StashGrid — Cloudflare Tunnel configuration
# Exposes ONLY the public shopping list routes to the internet.
# All inventory management routes stay LAN-only.
#
# Setup steps:
#   1. Install cloudflared on the Pi:
#        curl -L https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-archive-keyring.gpg >/dev/null
#        echo "deb [signed-by=/usr/share/keyrings/cloudflare-archive-keyring.gpg] https://pkg.cloudflare.com/cloudflared $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
#        sudo apt update && sudo apt install cloudflared
#
#   2. Authenticate and create the tunnel:
#        cloudflared tunnel login
#        cloudflared tunnel create stashgrid
#
#   3. Create a CNAME DNS record in Cloudflare dashboard:
#        Name:    stashgrid
#        Target:  <tunnel-id>.cfargotunnel.com
#
#   4. Copy this file to ~/.cloudflared/config.yml on the Pi
#      (replace <your-tunnel-id> with the UUID from step 2)
#
#   5. Install as a service:
#        sudo cloudflared service install
#        sudo systemctl enable cloudflared
#        sudo systemctl start cloudflared

tunnel: <your-tunnel-id>
credentials-file: /home/pi/.cloudflared/<your-tunnel-id>.json

ingress:
  # ── Public shopping list page ───────────────────────────────────────────────
  # Allows: /shop/<32-char-hex-token>
  - hostname: stashgrid.devinerickson.com
    path: "^/shop/[a-f0-9]{32}$"
    service: http://localhost:5000

  # ── Public shopping list data API (read) ────────────────────────────────────
  # Allows: /api/public/shopping-lists/<token>
  - hostname: stashgrid.devinerickson.com
    path: "^/api/public/shopping-lists/[a-f0-9]{32}$"
    service: http://localhost:5000

  # ── Public toggle API (check off items at the store) ────────────────────────
  # Allows: /api/public/shopping-lists/toggle/<token>/<item-id>
  - hostname: stashgrid.devinerickson.com
    path: "^/api/public/shopping-lists/toggle/[a-f0-9]{32}/[0-9]+$"
    service: http://localhost:5000

  # ── Block everything else ────────────────────────────────────────────────────
  # Any request to stashgrid.devinerickson.com that doesn't match above
  # (/, /edit/*, /remove/*, /api/rooms/*, etc.) returns 404 at the Cloudflare
  # edge — Flask never sees it.
  - service: http_status:404
