{% extends 'login.html' %}

{% block title %}StashGrid // Forgot Password{% endblock %}

{% block section_tag %}Forgot Password{% endblock %}

{% block body %}
<div class="notice-block">Enter the email on your account and we'll send a link to choose a new password.</div>
<form method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input id="email" class="field-input" type="email" name="email" maxlength="254"
            autocomplete="email" required autofocus>
    </div>
    <button type="submit" class="btn-login">&#9654; Send Reset Link</button>
</form>

<div class="gateway-nav">
    <a href="{{ url_for('core.login') }}">&#8592; Back to login</a>
</div>
{% endblock %}
